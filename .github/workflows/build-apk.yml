name: PocketForge — Build APK

on:
  workflow_dispatch:
    inputs:
      website_url:
        description: "HTTPS website URL (for example https://example.com)"
        required: true
        type: string
      app_name:
        description: "Name shown under the Android app icon"
        required: true
        type: string
      application_id:
        description: "Android package ID, e.g. com.example.portal"
        required: true
        type: string
      version_name:
        description: "App version, e.g. 1.0.0"
        required: true
        default: "1.0.0"
        type: string

permissions:
  contents: read

concurrency:
  group: pocketforge-${{ github.ref }}-${{ github.run_id }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate inputs and generate app configuration
        run: |
          python scripts/validate_input.py \
            --url "${{ inputs.website_url }}" \
            --app-name "${{ inputs.app_name }}" \
            --application-id "${{ inputs.application_id }}" \
            --version-name "${{ inputs.version_name }}"
          python scripts/generate_config.py \
            --url "${{ inputs.website_url }}" \
            --app-name "${{ inputs.app_name }}" \
            --application-id "${{ inputs.application_id }}" \
            --version-name "${{ inputs.version_name }}"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Run validation tests
        run: python -m unittest discover -s tests -v

      - name: Build debug APK
        working-directory: android
        run: gradle --no-daemon -PAPP_ID="${{ inputs.application_id }}" -PVERSION_NAME="${{ inputs.version_name }}" assembleDebug

      - name: Rename APK
        env:
          INPUT_APP_ID: ${{ inputs.application_id }}
          INPUT_VERSION: ${{ inputs.version_name }}
        run: |
          mkdir -p dist
          cp android/app/build/outputs/apk/debug/app-debug.apk "dist/${INPUT_APP_ID}-${INPUT_VERSION}.apk"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: pocketforge-apk
          path: dist/*.apk
          if-no-files-found: error
          retention-days: 14
